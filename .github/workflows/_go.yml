name: Go version

on:
  workflow_call:
    outputs:
      version:
        description: 'Go version for all CI actions'
        value: ${{ jobs.setup.outputs.version }}

env:
  # Must match go.mod (and api/v2, examples), .tool-versions and the Dockerfile
  # builder image. Enforced by the go-checks workflow.
  GO_VERSION: "1.26.10"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.GO_VERSION }}
    steps:
      - name: Set Go version
        run: echo "Go version is ${{ env.GO_VERSION }}"
